name: Deploy WP NN theme to Staging Site

on: 
    push: 
        branches: [MUSE-2552]

concurrency: MUSE-2552

jobs: 
    deploy:
        name: Deploy to Stage
        runs-on: ubuntu-latest
        
        steps:
            - name: Get latest theme code
              uses: actions/checkout@v4

            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.9.0
              with: 
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add known hosts
              run: |
                mkdir -p ~/.ssh
                ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to SpinupWP via SSH
              env:
                SSH_HOST: ${{ secrets.SSH_HOST }}
                SSH_USER: ${{ secrets.SSH_USER }}
                SOURCE_DIR: "."
                REMOTE_DIR: "~/files/wp-content/theme/wp-nn-theme"
              run: |

                # Create remote theme directory if it doesn't exist
                ssh $SSH_USER@$SSH_HOST "mkdir -p $REMOTE_DIR"

                # Deploy theme code using RSYNC with .deployignore
                rsync -avz \
                    --exclude-from=.deployignore \
                    . $SSH_USER@$SSH_HOST:$REMOTE_DIR
        